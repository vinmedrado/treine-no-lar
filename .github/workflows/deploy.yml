name: Publicar Treine no Lar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: treine-no-lar-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar aplicativo estatico
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos estaticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Aguardar pacote do Pages ficar disponivel
        run: sleep 12
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
